<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inclusive Writing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      padding: 40px 16px 60px;
    }

    .container { max-width: 780px; margin: 0 auto; }

    header { margin-bottom: 28px; }
    h1 { font-size: 2rem; font-weight: 700; color: #0f172a; }
    .subtitle {
      margin-top: 6px;
      color: #64748b;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .subtitle a { color: #2563eb; text-decoration: none; }
    .subtitle a:hover { text-decoration: underline; }

    /* Loading banner */
    #status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      font-size: 0.88rem;
      color: #1e40af;
      margin-bottom: 20px;
    }
    #status.error { background: #fff1f2; border-color: #fca5a5; color: #b91c1c; }
    #status.hidden { display: none; }

    .spinner {
      flex-shrink: 0;
      width: 16px; height: 16px;
      border: 2px solid #bfdbfe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* App card */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: .02em;
      color: #374151;
      margin-bottom: 6px;
    }

    select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #1e293b;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
      margin-bottom: 16px;
    }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 160px; line-height: 1.6; }
    select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    button {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }

    /* Results */
    .success {
      padding: 14px 16px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      color: #15803d;
      font-weight: 500;
    }

    .issue-count { margin-bottom: 12px; font-size: 0.95rem; }

    .issue-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .issue {
      padding: 12px 14px;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .issue-phrase { font-weight: 700; color: #92400e; }
    .issue-arrow { color: #9ca3af; margin: 0 7px; }
    .issue-replacement { color: #065f46; font-weight: 600; }

    h2 { font-size: 0.9rem; font-weight: 600; color: #475569; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .05em; }

    .text-preview {
      padding: 14px 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      line-height: 1.8;
      white-space: pre-wrap;
      font-size: 0.92rem;
      color: #334155;
      word-break: break-word;
    }
    mark {
      background: #fef08a;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 600;
    }

    footer {
      text-align: center;
      margin-top: 36px;
      font-size: 0.78rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Inclusive Writing</h1>
    <p class="subtitle">
      Detect non-inclusive language and get suggestions &mdash; runs entirely in your
      browser via <a href="https://pyodide.org" target="_blank" rel="noopener">Pyodide</a>
      (Python&nbsp;compiled to&nbsp;WebAssembly, no&nbsp;server&nbsp;required).
    </p>
  </header>

  <div id="status">
    <div class="spinner"></div>
    <span id="status-text">Loading Python environment&hellip; this may take a moment on first visit.</span>
  </div>

  <div id="app" class="card" hidden>
    <label for="lang">Language</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="fr">Fran&ccedil;ais</option>
    </select>

    <label for="text">Text to analyse</label>
    <textarea id="text" placeholder="Paste or type your text here&hellip;"></textarea>

    <button id="analyze-btn" disabled>Analyse</button>
  </div>

  <div id="results"></div>

  <footer>Powered by <a href="https://pyodide.org" target="_blank" rel="noopener">Pyodide</a> &amp; inclusivewriting</footer>

</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
(async () => {
  const statusEl  = document.getElementById("status");
  const statusTxt = document.getElementById("status-text");
  const appEl     = document.getElementById("app");
  const analyzeBtn= document.getElementById("analyze-btn");
  const resultsEl = document.getElementById("results");

  function setStatus(msg, isError = false) {
    statusTxt.textContent = msg;
    statusEl.className = isError ? "error" : "";
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Parse <change>…</change> tags from updated_text and wrap in <mark>
  function highlightChanges(updatedText) {
    return updatedText
      .split(/(<change>[\s\S]*?<\/change>)/)
      .map(part => {
        const m = part.match(/^<change>([\s\S]*)<\/change>$/);
        return m ? `<mark>${escHtml(m[1])}</mark>` : escHtml(part);
      })
      .join("");
  }

  function renderResults(data) {
    if (data.found.length === 0) {
      resultsEl.innerHTML =
        `<div class="card"><div class="success">&#10003;&nbsp;No non-inclusive language detected.</div></div>`;
      return;
    }

    const items = Object.entries(data.suggestions).map(([phrase, repls]) => {
      const replHtml = repls.length
        ? repls.map(r => `<span class="issue-replacement">${escHtml(r)}</span>`).join(",&nbsp;")
        : "<em>no suggestion available</em>";
      return `<li class="issue">
        <span class="issue-phrase">${escHtml(phrase)}</span>
        <span class="issue-arrow">&#8594;</span>
        ${replHtml}
      </li>`;
    }).join("");

    resultsEl.innerHTML = `<div class="card">
      <p class="issue-count"><strong>${data.found.length}</strong> issue(s) found</p>
      <ul class="issue-list">${items}</ul>
      <h2>Your text &mdash; issues highlighted</h2>
      <div class="text-preview">${highlightChanges(data.updated_text)}</div>
    </div>`;
  }

  // ── Bootstrap Pyodide ───────────────────────────────────────────────────────

  try {
    setStatus("Loading Pyodide (Python / WebAssembly)…");
    const pyodide = await loadPyodide();

    setStatus("Loading micropip…");
    await pyodide.loadPackage("micropip");

    setStatus("Installing inclusivewriting…");
    // Fetch the manifest written by CI to get the exact wheel filename.
    // micropip requires the full PEP 427 name (name-ver-pytag-abitag-platform.whl).
    const { wheel } = await fetch("./wheel.json").then(r => r.json());
    await pyodide.runPythonAsync(`
import micropip
await micropip.install("./${wheel}", deps=False)
`);

    statusEl.classList.add("hidden");
    appEl.hidden = false;
    analyzeBtn.disabled = false;

    // ── Analyse handler ───────────────────────────────────────────────────────

    analyzeBtn.addEventListener("click", async () => {
      const lang = document.getElementById("lang").value;
      const text = document.getElementById("text").value.trim();
      if (!text) return;

      analyzeBtn.disabled = true;
      analyzeBtn.textContent = "Analysing…";
      resultsEl.innerHTML = "";

      try {
        pyodide.globals.set("_lang", lang);
        pyodide.globals.set("_text", text);

        const raw = await pyodide.runPythonAsync(`
import json
from inclusivewriting.suggestions import detect_and_get_suggestions

used_suggestions, suggestions, updated_text = detect_and_get_suggestions(_lang, _text)

json.dumps({
    "found": sorted(used_suggestions),
    "suggestions": {
        phrase: [r.get_value() for r in s.get_replacement_lexemes()]
        for phrase, s in suggestions.items()
    },
    "updated_text": updated_text,
})
`);

        renderResults(JSON.parse(raw));
      } catch (err) {
        resultsEl.innerHTML =
          `<div class="card"><p style="color:#b91c1c"><strong>Error:</strong> ${escHtml(err.message)}</p></div>`;
      }

      analyzeBtn.disabled = false;
      analyzeBtn.textContent = "Analyse";
    });

  } catch (err) {
    setStatus("Failed to load Python environment: " + err.message, true);
  }
})();
</script>
</body>
</html>
